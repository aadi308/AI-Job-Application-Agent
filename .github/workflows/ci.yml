name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app scripts tests
      - name: Run deterministic unit tests
        run: python -m pytest

  integration-tests:
    name: Integration tests (PostgreSQL and PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: job_search_test
          POSTGRES_PASSWORD: job_search_test
          POSTGRES_DB: job_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_search_test -d job_search_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://job_search_test:job_search_test@127.0.0.1:5432/job_search_test
      TEST_DATABASE_URL: postgresql://job_search_test:job_search_test@127.0.0.1:5432/job_search_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Install Chromium for PDF tests
        run: python -m playwright install --with-deps chromium
      - name: Initialize test schema
        run: python scripts/init_db.py
      - name: Run isolated integration tests
        run: python -m pytest -o addopts="-ra" -m "integration and not live"
